<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azali | Technical Support</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      color: #e2e8f0;
      font-family: Arial, Helvetica, sans-serif;
    }

    .profile-card {
      width: 90%;
      max-width: 420px;
      padding: 40px 32px;
      text-align: center;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    .avatar {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      background: #38bdf8;
      color: #0f172a;
      font-size: 32px;
      font-weight: bold;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 32px;
      text-transform: capitalize;
    }

    .role {
      margin-bottom: 25px;
      color: #38bdf8;
      font-size: 16px;
      font-weight: bold;
    }

    .about {
      margin-bottom: 25px;
      color: #94a3b8;
      line-height: 1.6;
    }

    .skills {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
    }

    .skill {
      padding: 8px 16px;
      border-radius: 20px;
      background: #0f172a;
      border: 1px solid #475569;
      color: #cbd5e1;
      font-size: 14px;
    }

    .fun-fact {
      padding: 15px;
      border-radius: 12px;
      background: #172033;
      color: #cbd5e1;
      font-size: 14px;
    }

    .fun-fact span {
      display: block;
      margin-bottom: 5px;
      color: #38bdf8;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main class="profile-card">
    <div class="avatar">A</div>

    <h1>azali</h1>
    <p class="role">Technical Support</p>

    <p class="about">
      Technical Support yang sentiasa berminat untuk meneroka
      teknologi dan meningkatkan kemahiran dalam bidang IT.
    </p>

    <div class="skills">
      <span class="skill">Linux</span>
      <span class="skill">Git</span>
      <span class="skill">Docker</span>
    </div>

    <div class="fun-fact">
      <span>💡 Fakta Menarik</span>
      Suka belajar benda baru
    </div>
  </main>
</body>
</html>
